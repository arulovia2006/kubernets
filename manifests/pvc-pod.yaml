
apiVersion: v1
kind: Pod
metadata:
  name: pvc-test-pod
  namespace: devops-lab
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo 'Persistent storage works!' > /data/test.txt && sleep 3600"
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: devops-web-pvc
